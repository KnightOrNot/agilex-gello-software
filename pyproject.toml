[project]
name = "agilex-gello-software"
version = "0.1.0"
description = "Reusable GELLO input, calibration, and upstream teleoperation tools"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { file = "LICENSE" }
authors = [{ name = "Philipp Wu" }]
dependencies = [
    "dynamixel-sdk==3.7.51",
    "numpy>=1.26",
    "omegaconf==2.3.0",
    "pyyaml>=6.0",
    "pyzmq>=26.0",
    "termcolor>=2.4",
    "tyro>=0.9",
]

[project.optional-dependencies]
camera = ["pillow>=10", "pyrealsense2>=2.55"]
simulation = ["dm-control>=1.0.20", "mujoco>=3.2", "numpy-quaternion>=2024.0", "pin==3.7.0", "pygame>=2.6", "pyqt6>=6.7"]
robots = ["pyspacemouse>=1.1", "pure-python-adb>=0.3.0.dev0", "ur-rtde>=1.6", "xarm-python-sdk>=1.14"]
full = ["dm-control>=1.0.20", "mujoco>=3.2", "numpy-quaternion>=2024.0", "pillow>=10", "pin==3.7.0", "pure-python-adb>=0.3.0.dev0", "pygame>=2.6", "pyqt6>=6.7", "pyrealsense2>=2.55", "pyspacemouse>=1.1", "ur-rtde>=1.6", "xarm-python-sdk>=1.14"]

[project.scripts]
agilex-gello-software = "agilex_gello_software.cli:main"
gello = "agilex_gello_software.cli:main"

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.9"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gello", "src/agilex_gello_software"]

[tool.hatch.build.targets.sdist]
include = [
    "/gello", "/src", "/tests", "/docs", "/configs", "/experiments",
    "/scripts", "/README.md", "/CONTRIBUTING.md", "/CHANGELOG.md",
    "/AGENTS.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version",
    "/third_party/DynamixelSDK/python", "/third_party/DynamixelSDK/LICENSE",
]

[tool.uv.sources]
dynamixel-sdk = { path = "third_party/DynamixelSDK/python", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint.isort]
known-first-party = ["agilex_gello_software"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.uv]
package = true
